<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Генератор иконок AdAstra</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
body{font-family:system-ui;background:#0b0b0d;color:#fff;padding:40px;text-align:center}
button{background:#d4af37;color:#000;border:none;padding:15px 30px;font-size:18px;border-radius:8px;cursor:pointer;margin:20px}
button:hover{background:#f4cf57}
.preview{margin:20px auto;display:flex;gap:20px;justify-content:center;flex-wrap:wrap}
.preview canvas{border:1px solid #333;border-radius:8px}
.info{color:#888;margin-top:20px}
</style>
</head>
<body>
<h1>🚀 Генератор иконок AdAstra</h1>
<p>Одна звезда · золотая ракета · правильные размеры · maskable safe zone</p>
<button onclick="generate()">⬇ Сгенерировать и скачать ZIP</button>
<div class="preview" id="preview"></div>
<div class="info">После скачивания распакуй ZIP в папку <code>icons/</code> в корне проекта</div>

<script>
function drawIcon(size, maskable = false) {
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');
  const pad = maskable ? size * 0.2 : size * 0.05;
  const s = size - pad * 2;
  const cx = size / 2, cy = size / 2;

  ctx.fillStyle = '#0b0b0d';
  ctx.fillRect(0, 0, size, size);

  const grad = ctx.createLinearGradient(cx - s/3, cy - s/2, cx + s/3, cy + s/2);
  grad.addColorStop(0, '#f4cf57');
  grad.addColorStop(0.5, '#d4af37');
  grad.addColorStop(1, '#a8841f');

  ctx.save();
  ctx.translate(cx, cy + s * 0.05);

  ctx.strokeStyle = grad;
  ctx.lineWidth = s * 0.04;
  ctx.beginPath();
  ctx.ellipse(0, s * 0.1, s * 0.38, s * 0.12, 0, 0, Math.PI * 2);
  ctx.stroke();

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.45);
  ctx.bezierCurveTo(s * 0.18, -s * 0.3, s * 0.2, s * 0.1, s * 0.15, s * 0.3);
  ctx.lineTo(-s * 0.15, s * 0.3);
  ctx.bezierCurveTo(-s * 0.2, s * 0.1, -s * 0.18, -s * 0.3, 0, -s * 0.45);
  ctx.fill();

  ctx.fillStyle = '#0b0b0d';
  ctx.beginPath();
  ctx.arc(0, -s * 0.05, s * 0.08, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = grad;
  ctx.lineWidth = s * 0.02;
  ctx.stroke();

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(-s * 0.15, s * 0.2);
  ctx.lineTo(-s * 0.28, s * 0.4);
  ctx.lineTo(-s * 0.08, s * 0.3);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(s * 0.15, s * 0.2);
  ctx.lineTo(s * 0.28, s * 0.4);
  ctx.lineTo(s * 0.08, s * 0.3);
  ctx.closePath();
  ctx.fill();

  for (let i = 0; i < 5; i++) {
    ctx.fillStyle = grad;
    ctx.globalAlpha = 0.7 - i * 0.1;
    ctx.beginPath();
    ctx.moveTo(-s * 0.04 + (Math.random()-0.5)*s*0.08, s * 0.35 + i * s * 0.06);
    ctx.lineTo(s * 0.04 + (Math.random()-0.5)*s*0.08, s * 0.35 + i * s * 0.06);
    ctx.lineTo((Math.random()-0.5)*s*0.04, s * 0.5 + i * s * 0.06);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const sx = s * 0.32, sy = -s * 0.32;
  ctx.fillStyle = grad;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * Math.PI * 2 - Math.PI / 2;
    const r = i % 2 === 0 ? s * 0.12 : s * 0.05;
    const x = sx + Math.cos(angle) * r;
    const y = sy + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
  ctx.fill();

  ctx.restore();
  return c;
}

async function generate() {
  const zip = new JSZip();
  const sizes = [72, 96, 128, 144, 152, 192, 384, 512];
  const preview = document.getElementById('preview');
  preview.innerHTML = '';

  sizes.forEach(size => {
    const canvas = drawIcon(size, size >= 192);
    canvas.toBlob(blob => {
      zip.file(`icon-${size}x${size}.png`, blob);
    });
    if (size <= 192) {
      const small = document.createElement('canvas');
      small.width = 96; small.height = 96;
      small.getContext('2d').drawImage(canvas, 0, 0, 96, 96);
      preview.appendChild(small);
    }
  });

  setTimeout(async () => {
    const content = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(content);
    a.download = 'adastra-icons.zip';
    a.click();
  }, 500);
}
</script>
</body>
</html>
