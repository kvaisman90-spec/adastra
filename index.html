<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AdAstra — реклама до звёзд</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b0b0d">
  <link rel="apple-touch-icon" href="/icon-star.png">
  <style>
    :root { --bg: #0b0b0d; --card: #16161a; --accent: #7f5af0; --text: #fffffe; --sub: #94a1b2; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 80px; min-height: 100vh; }
    
    /* Header & Nav */
    header { padding: 15px; display: flex; justify-content: space-between; align-items: center; background: rgba(11,11,13,0.95); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); border-bottom: 1px solid #242629; }
    .logo { font-weight: 800; font-size: 1.2rem; color: var(--accent); }
    nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #242629; z-index: 100; }
    nav button { background: none; border: none; color: var(--sub); font-size: 0.7rem; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
    nav button.active { color: var(--accent); }
    nav button span { font-size: 1.4rem; }

    /* Sections */
    section { display: none; padding: 20px; max-width: 800px; margin: 0 auto; animation: fadeIn 0.3s ease; }
    section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Components */
    .card { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #242629; }
    h2 { margin-bottom: 15px; font-size: 1.4rem; }
    label { display: block; margin: 10px 0 5px; color: var(--sub); font-size: 0.9rem; }
    input, select, textarea { width: 100%; padding: 12px; background: #0b0b0d; border: 1px solid #242629; border-radius: 8px; color: white; font-size: 1rem; margin-bottom: 10px; }
    button.primary { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 10px; }
    button.primary:active { opacity: 0.8; }
    
    /* Admin Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #242629; }
    th { color: var(--sub); }
    .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; }
    .badge.pending { background: #ffb70333; color: #ffb703; }
    .badge.paid { background: #2cb67d33; color: #2cb67d; }
    .badge.free { background: #7f5af033; color: #7f5af0; }
    
    /* Lang Switcher */
    .lang-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
    .lang-btn { padding: 6px 12px; border-radius: 20px; border: 1px solid #242629; background: transparent; color: var(--sub); font-size: 0.8rem; white-space: nowrap; cursor: pointer; }
    .lang-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

    /* Feed Grid */
    .feed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    .ad-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; background: #242629; }
  </style>
</head>
<body>

<header>
  <div class="logo">⭐ AdAstra</div>
  <select id="globalRegion" style="width: auto; padding: 5px 10px; margin:0; font-size: 0.8rem;">
    <option value="world">🌍 Весь мир</option>
    <option value="il">🇮🇱 Израиль</option>
    <option value="us">🇺🇸 США</option>
    <option value="de">🇩🇪 Германия</option>
    <option value="ua">🇺🇦 Украина</option>
    <option value="ru">🇷🇺 Россия</option>
  </select>
</header>

<!-- STUDIO -->
<section id="studio">
  <div class="card">
    <h2>🎨 Студия рекламы</h2>
    <label>Формат</label>
    <select id="adFormat">
      <option value="banner">🖼 Баннер</option>
      <option value="post">📝 Пост</option>
      <option value="stories">📲 Сторис</option>
    </select>
    <label>Заголовок</label>
    <input type="text" id="adTitle" placeholder="Ваш заголовок">
    <label>Текст рекламы</label>
    <textarea id="adText" rows="3" placeholder="Яркий текст..."></textarea>
    <label>Регион показа</label>
    <select id="adRegion">
      <option value="world">Весь мир</option>
      <option value="il">Израиль</option>
      <option value="us">США</option>
      <option value="de">Германия</option>
      <option value="ua">Украина</option>
    </select>
    <label>Город (опционально)</label>
    <input type="text" id="adCity" placeholder="Например: Тель-Авив">
    <label>Языки автоперевода</label>
    <div class="lang-bar" id="langSelector">
      <button class="lang-btn active" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="he">HE</button>
      <button class="lang-btn" data-lang="ar">AR</button>
      <button class="lang-btn" data-lang="ru">RU</button>
      <button class="lang-btn" data-lang="es">ES</button>
      <button class="lang-btn" data-lang="fr">FR</button>
      <button class="lang-btn" data-lang="zh">ZH</button>
    </div>
    <label>Контакт / CTA</label>
    <input type="text" id="adContact" placeholder="Ссылка или телефон">
    <button class="primary" onclick="publishAd()">🚀 Опубликовать рекламу</button>
  </div>
</section>

<!-- FEED -->
<section id="feed">
  <h2>📰 Лента рекламы</h2>
  <div class="lang-bar" id="feedLangFilter"></div>
  <div class="feed-grid" id="feedContainer"></div>
</section>

<!-- CALCULATOR -->
<section id="calc">
  <div class="card">
    <h2>🧮 Калькулятор счёта</h2>
    <label>Срок (дней)</label>
    <input type="number" id="calcDays" value="30" min="1">
    <label>Объём (макс 10 шт)</label>
    <input type="number" id="calcVol" value="1" min="1" max="10">
    <div style="margin-top:15px; font-size:1.2rem; font-weight:700;" id="calcResult">$49</div>
    <button class="primary" onclick="alert('Переход к оплате...')">🧾 Выставить счёт</button>
  </div>
</section>

<!-- ADMIN PANEL -->
<section id="admin">
  <div class="card">
    <h2>👑 Панель создателя</h2>
    <div style="display:grid; grid-template-columns: repeat(3,1fr); gap:10px; margin-bottom:20px; text-align:center;">
      <div><div style="font-size:1.5rem; font-weight:800;" id="statTotal">0</div><div style="color:var(--sub); font-size:0.8rem;">Клиентов</div></div>
      <div><div style="font-size:1.5rem; font-weight:800; color:#2cb67d;" id="statPaid">0</div><div style="color:var(--sub); font-size:0.8rem;">Платных</div></div>
      <div><div style="font-size:1.5rem; font-weight:800; color:#ffb703;" id="statPending">0</div><div style="color:var(--sub); font-size:0.8rem;">На модерации</div></div>
    </div>
    
    <h3>Модерация объявлений</h3>
    <div class="table-wrap">
      <table id="adminTable">
        <thead><tr><th>Дата</th><th>Клиент</th><th>Регион</th><th>Статус</th><th>Действие</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</section>

<nav>
  <button onclick="router('studio')" class="active"><span>🎨</span>Студия</button>
  <button onclick="router('feed')"><span>📰</span>Лента</button>
  <button onclick="router('calc')"><span>🧮</span>Счёт</button>
  <button onclick="router('admin')"><span>👑</span>Админ</button>
</nav>

<script>
  // === STATE & CONFIG ===
  const API_URL = '/api/admin';
  let DB = { ads: [], subscribers: [], messages: [] };
  let currentLang = navigator.language.slice(0,2).toLowerCase() || 'en';
  
  // === ROUTER ===
  function router(sectionId) {
    document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
    document.getElementById(sectionId).classList.add('active');
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    event.currentTarget?.classList.add('active');
    
    // Refresh data on tab switch for sync
    if(sectionId === 'feed' || sectionId === 'admin') loadData();
  }

  // === DATA SYNC ===
  async function loadData() {
    try {
      const res = await fetch(API_URL);
      if(res.ok) DB = await res.json();
      renderFeed();
      renderAdmin();
    } catch(e) { console.error('Sync failed', e); }
  }

  // === STUDIO LOGIC ===
  const langBtns = document.querySelectorAll('#langSelector .lang-btn');
  langBtns.forEach(btn => btn.onclick = () => btn.classList.toggle('active'));

  async function publishAd() {
    const langs = [...document.querySelectorAll('#langSelector .lang-btn.active')].map(b => b.dataset.lang);
    const payload = {
      owner: 'Guest_' + Math.floor(Math.random()*1000),
      title: document.getElementById('adTitle').value,
      text: document.getElementById('adText').value,
      format: document.getElementById('adFormat').value,
      region: document.getElementById('adRegion').value,
      city: document.getElementById('adCity').value,
      contact: document.getElementById('adContact').value,
      langs: langs
    };
    
    if(!payload.title || !payload.text) return alert('Заполните заголовок и текст!');
    
    await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action: 'publish', ...payload })
    });
    alert('✅ Отправлено на модерацию!');
    document.getElementById('adTitle').value = '';
    document.getElementById('adText').value = '';
  }

  // === FEED RENDER ===
  function renderFeed() {
    const container = document.getElementById('feedContainer');
    const region = document.getElementById('globalRegion').value;
    
    const approved = DB.ads.filter(ad => 
      (ad.status === 'approved_paid' || ad.status === 'approved_free' || ad.status === 'paid') &&
      (ad.region === 'world' || ad.region === region)
    ).sort((a,b) => b.id - a.id);

    container.innerHTML = approved.map(ad => `
      <div class="card ad-card">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
          <span class="badge ${ad.paid ? 'paid' : 'free'}">${ad.paid ? '💎 Premium' : '✨ Free'}</span>
          <span style="color:var(--sub); font-size:0.8rem;">${ad.region.toUpperCase()} ${ad.city ? '• '+ad.city : ''}</span>
        </div>
        <h3>${ad.title}</h3>
        <p style="color:var(--sub); margin:8px 0;">${ad.text}</p>
        <div style="display:flex; gap:5px; flex-wrap:wrap; margin-top:10px;">
          ${(ad.langs||[]).map(l => `<span style="font-size:0.7rem; background:#242629; padding:2px 6px; border-radius:4px;">${l.toUpperCase()}</span>`).join('')}
        </div>
        ${ad.contact ? `<a href="${ad.contact}" target="_blank" style="display:block; margin-top:12px; color:var(--accent); text-decoration:none; font-weight:700;">Подробнее →</a>` : ''}
      </div>
    `).join('') || '<p style="color:var(--sub); text-align:center; padding:40px;">Пока нет рекламы в этом регионе 🌌</p>';
  }

  // === ADMIN RENDER ===
  function renderAdmin() {
    const tbody = document.querySelector('#adminTable tbody');
    document.getElementById('statTotal').innerText = DB.ads.length;
    document.getElementById('statPaid').innerText = DB.ads.filter(a => a.paid).length;
    document.getElementById('statPending').innerText = DB.ads.filter(a => a.status === 'pending').length;

    tbody.innerHTML = DB.ads.sort((a,b) => b.id - a.id).map(ad => `
      <tr>
        <td>${new Date(ad.created_at).toLocaleDateString()}</td>
        <td>${ad.owner}<br><small style="color:var(--sub)">${ad.title.slice(0,20)}...</small></td>
        <td>${ad.region} ${ad.city ? '<br>'+ad.city : ''}</td>
        <td><span class="badge ${ad.status.replace('approved_','')}">${ad.status}</span></td>
        <td style="white-space:nowrap;">
          ${ad.status === 'pending' ? `
            <button onclick="adminAction('approve_paid',${ad.id})" style="background:#2cb67d;border:none;padding:4px 8px;border-radius:4px;color:white;cursor:pointer;">✓ Paid</button>
            <button onclick="adminAction('approve_free',${ad.id})" style="background:#7f5af0;border:none;padding:4px 8px;border-radius:4px;color:white;cursor:pointer;">✓ Free</button>
            <button onclick="adminAction('reject',${ad.id})" style="background:#e53170;border:none;padding:4px 8px;border-radius:4px;color:white;cursor:pointer;">✗</button>
          ` : `
            <button onclick="adminAction('delete',${ad.id})" style="background:#e53170;border:none;padding:4px 8px;border-radius:4px;color:white;cursor:pointer;">Удалить</button>
          `}
        </td>
      </tr>
    `).join('');
  }

  async function adminAction(action, id) {
    if(!confirm('Подтвердить действие?')) return;
    await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action, id })
    });
    loadData();
  }

  // === CALCULATOR ===
  const calcDays = document.getElementById('calcDays');
  const calcVol = document.getElementById('calcVol');
  function updateCalc() {
    let days = parseInt(calcDays.value) || 1;
    let vol = parseInt(calcVol.value) || 1;
    let base = days <= 30 ? 49 : (days / 30) * 49;
    let extra = vol > 3 ? (vol - 3) * (base * 0.02) : 0;
    document.getElementById('calcResult').innerText = '$' + Math.round(base + extra);
  }
  calcDays.oninput = updateCalc;
  calcVol.oninput = updateCalc;

  // === INIT ===
  document.getElementById('globalRegion').onchange = renderFeed;
  window.onload = () => {
    // Auto-detect region
    const tz = Intl.DateTimeFormat().resolvedOptions().timeZone.toLowerCase();
    if(tz.includes('jerusalem')) document.getElementById('globalRegion').value = 'il';
    else if(tz.includes('new_york') || tz.includes('chicago')) document.getElementById('globalRegion').value = 'us';
    else if(tz.includes('berlin')) document.getElementById('globalRegion').value = 'de';
    
    loadData();
    updateCalc();
  };

  // Register SW
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
  }
</script>
</body>
</html>
